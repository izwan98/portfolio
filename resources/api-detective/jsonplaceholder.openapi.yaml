openapi: 3.0.3
info:
  title: JSONPlaceholder
  version: "1.0"
  description: >-
    Free fake REST API for testing and prototyping. Writes are simulated: the
    server responds as if the resource was created or changed, but nothing is stored.
servers:
  - url: https://jsonplaceholder.typicode.com
tags:
  - name: posts
    description: Blog posts written by users
  - name: comments
    description: Comments left on posts
  - name: users
    description: People who write posts
  - name: todos
    description: Users' to-do items
paths:
  /posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: List posts
      parameters:
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: All posts, optionally filtered by author
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Post' }
    post:
      tags: [posts]
      operationId: createPost
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPost' }
      responses:
        '201':
          description: The created post (simulated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      operationId: getPost
      summary: Get a post
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [posts]
      operationId: replacePost
      summary: Replace a post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Post' }
      responses:
        '200':
          description: The replaced post (simulated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
    patch:
      tags: [posts]
      operationId: updatePost
      summary: Update part of a post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, example: An even better title }
                body: { type: string }
      responses:
        '200':
          description: The updated post (simulated)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
    delete:
      tags: [posts]
      operationId: deletePost
      summary: Delete a post
      responses:
        '200':
          description: Deleted (simulated)
  /posts/{postId}/comments:
    get:
      tags: [comments]
      operationId: listPostComments
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Comments on the post
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
  /comments:
    get:
      tags: [comments]
      operationId: listComments
      summary: List comments
      parameters:
        - name: postId
          in: query
          description: Only comments on this post
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
  /users/{userId}:
    get:
      tags: [users]
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 10, example: 1 }
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
  /todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: List to-dos
      parameters:
        - $ref: '#/components/parameters/UserIdFilter'
        - name: completed
          in: query
          description: Filter by status
          schema: { type: boolean }
      responses:
        '200':
          description: To-do items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Todo' }
  /todos/{todoId}:
    get:
      tags: [todos]
      operationId: getTodo
      deprecated: true
      description: Kept for older clients. Prefer filtering /todos instead.
      parameters:
        - name: todoId
          in: path
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: The to-do
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
components:
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      description: Post ID (1–100)
      schema: { type: integer, minimum: 1, maximum: 100, example: 1 }
    UserIdFilter:
      name: userId
      in: query
      description: Only items belonging to this user
      schema: { type: integer, example: 1 }
    Page:
      name: _page
      in: query
      description: Page number
      schema: { type: integer, minimum: 1 }
    Limit:
      name: _limit
      in: query
      description: Items per page
      schema: { type: integer, minimum: 1, maximum: 100, example: 10 }
  responses:
    NotFound:
      description: No resource with that ID
      content:
        application/json:
          schema: { type: object }
  schemas:
    NewPost:
      type: object
      required: [title, body, userId]
      properties:
        title: { type: string, example: Notes from the field }
        body: { type: string, example: Every API leaves clues. }
        userId: { type: integer, example: 1 }
    Post:
      allOf:
        - $ref: '#/components/schemas/NewPost'
        - type: object
          required: [id]
          properties:
            id: { type: integer, example: 101 }
    Comment:
      type: object
      required: [id, postId, name, email, body]
      properties:
        id: { type: integer }
        postId: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        body: { type: string }
    User:
      type: object
      required: [id, name, username, email]
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        website: { type: string }
        address:
          type: object
          properties:
            street: { type: string }
            city: { type: string }
            zipcode: { type: string }
            geo:
              type: object
              properties:
                lat: { type: string }
                lng: { type: string }
        company:
          type: object
          properties:
            name: { type: string }
            catchPhrase: { type: string }
    Todo:
      type: object
      required: [id, userId, title, completed]
      properties:
        id: { type: integer }
        userId: { type: integer }
        title: { type: string }
        completed: { type: boolean }
